services:
  - type: web
    name: studymate-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: SQLITE_PATH
        value: /opt/render/project/src/data/student_monitoring.db
